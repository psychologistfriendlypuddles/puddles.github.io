<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silvamor</title>
  <meta name="description" content="Silvamor — Placeholder landing page." />
  <style>
    :root {
      --bg: #0c0e12;
      --surface: #141820;
      --border: #232a38;
      --text: #e6eaf2;
      --muted: #8b95a7;
      --accent: #7aa2f7;
      --accent-dim: rgba(122, 162, 247, 0.12);
      --status: #4fd6be;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }

    .card {
      width: 100%;
      max-width: 540px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.25rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid rgba(122, 162, 247, 0.25);
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--status);
      box-shadow: 0 0 8px var(--status);
    }

    h1 {
      font-size: clamp(1.85rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--muted);
      font-size: 1rem;
    }

    footer {
      border-top: 1px solid var(--border);
      margin-top: 1.75rem;
      padding-top: 1.1rem;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">
      <span class="dot" aria-hidden="true"></span>
      <span>silvamor.com</span>
    </div>
    <h1>Silvamor</h1>
    <p>Placeholder page. Content is currently in progress.</p>
    <footer>&copy; 2026 Silvamor</footer>
  </main>
</body>
</html>
